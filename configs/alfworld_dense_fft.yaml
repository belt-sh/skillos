# FULL-FIDELITY ("dense") ALFWorld Algorithm 1 run, 2026-08-17.
#
# Identical to alfworld_8xh100_algo1_fft.yaml in every paper hyperparameter.
# The ONLY change is outside this file: the phase budget and the NCCL collective
# timeout are sized so all 9 informed positions per rollout actually run, instead
# of the 2.3 of 9 measured under the old 1h budget (DIVERGENCES #16). |G| stays
# at the paper's 10.
#
# Launch with ./run_algo1_dense.sh — the env vars there are load-bearing.
# Expect ~4h/step, ~10 days for 60 steps. That is the price of the protocol on
# this hardware; the workload is bound by remote executor calls, not by GPUs.
#
# SkillOS ALFWorld training — 8x H100, PAPER ALGORITHM 1, FULL FINE-TUNE.
# v8 recipe with LoRA → full fine-tuning, on the NOTES-VALIDATED sharding path.
#
# Purpose: test whether the bimodal-trajectory shape (ckpt30 peak, not the
# paper's monotone-to-60) is a LoRA artifact. If FFT gives a monotone curve,
# LoRA (or KL) caused it; if still bimodal, it's the TRL-vs-verl framework.
#
# SHARDING DECISION — ZeRO-3 + vLLM colocate (EMPIRICALLY validated THIS stack):
#   Prior FFT losses (belt gotchas) + this session's findings:
#     1. v6 ZeRO-2 + KL → OOM (params 16G replicated + ref 16G + vLLM 32G).
#     2. FSDP FULL_SHARD/SHARD_GRAD_OP → generation WEDGE (GPUs pinned 100%).
#     3. ZeRO-2 without vLLM → 25-50x slower, NCCL watchdog blew.
#   The notes say "ZeRO-2 + vLLM colocate is validated" — but that is from an
#   OLDER stack. On THIS stack (trl 1.4 / transformers 5.9 / deepspeed 0.19),
#   ZeRO-2 + vLLM colocate HUNG: GPUs 0% util, 42 min no progress, first vLLM
#   generation never produced tokens (2026-06-21). The ZeRO-3 + vLLM SMOKE, by
#   contrast, WORKED: generation progressed (311 deadline cuts), step 1 closed,
#   peak 65.5G/81.5G, no OOM, no wedge. So we use ZeRO-3 (the empirically
#   working path here), which also SHARDS the ref model → beta=0.001 fits, so
#   this is v8 EXACTLY minus LoRA (cleanest comparison).
#   Residual risk: ZeRO-3 shards params → per-step vLLM weight-gather. Mitigation:
#   watch the reward/KL trend over the first steps — sane movement confirms the
#   weights sync (degenerate/flat reward = stale-weight bug, abort).
#
# Launch via ./run_algo1_fft.sh  (uses configs/accelerate_zero3.yaml).

model: Qwen/Qwen3-8B
output_dir: ./output/alfworld-dense-fft-seed1

epochs: 1
max_steps: 60                     # paper budget (Table 4)
num_episodes: 3553                # paper training split (→ 355 groups of |G|=10)
# Effective batch is UNCHANGED at the paper's 32 (4 × 1 × 8 procs). Only the
# split changes: one micro-batch instead of two.
#
# Why it matters here and nowhere else: accumulation steps run SEQUENTIALLY, and
# each rollout in a micro-batch is a chain of 10 remote ALFWorld episodes. With
# accum=2 only 16 rollouts are ever in flight, so a step costs two 64-minute
# passes. With accum=1 all 32 run at once and a step is one pass. Measured
# 2026-08-17: ~16 concurrent episodes at accum=2, against the 32 the batch
# implies. Same gradient, half the wall clock.
#
# Cost: per-device generation memory doubles. ZeRO-3 + vLLM colocate at 0.3
# utilisation peaked at 65.5/81.5 GB with per_device=2, so this is plausible but
# unproven; an OOM shows up in the first minutes, not at step 30.
batch_size: 4                     # per device
gradient_accumulation_steps: 1    # 4 × 1 × 8 procs = 32 (paper effective batch)
learning_rate: 1.0e-6             # paper's EXACT FFT rate (no LoRA 10× compensation)
num_generations: 8                # paper GRPO group size N=8
# NOT the paper's "Max Response Length" as applied here. Measured 2026-08-17.
#
# TRL enforces this against the ACCUMULATED multi-turn completion:
#   grpo_trainer.py:1620  len(pct) - len(prompt_ids[i]) > self.max_completion_length
# where pct is prompt + completion + every tool result so far. One tool result is
# an entire ALFWorld trajectory, ~685 tokens at 21 steps, plus the curator's own
# tool-call text (skill bodies, often several hundred more). So 4096 holds about
# 3 positions, and TRL silently drops the tool result and ends the rollout there.
#
# That, not the phase budget, is why r_task was measured from ~2 of 9 positions.
# Proof: with the budget raised from 1h to 5h the median stayed at 2, and the run
# logged ZERO deadline cuts and ZERO executor timeouts. The phase budget was a
# real cause in the older 1h runs; this was the second cause hiding behind it.
#
# The paper's 4096 is a cap on the curator's RESPONSE, not on a ten-position
# conversation carrying ten trajectories. Conflating the two is a TRL artifact,
# so raising it is MORE faithful to the protocol, not less. Budget for it:
#   10 positions x (~685 tool result + ~400 curator response) ~= 11k tokens
# Qwen3-8B is natively 32768 and the prompt is ~500 tokens, so 16384 fits with
# room to spare.
max_completion_length: 16384
temperature: 1.0                  # paper rollout temperature
beta: 0.001                       # paper Table 4 KL; ZeRO-3 shards the ref model
                                  # so it fits (smoke-proven 65.5G). = v8 exactly.
loss_type: grpo                   # paper GRPO loss
lr_scheduler_type: constant       # paper lr held constant

# Algorithm 1 specifics.
group_size: 10                    # paper |G|=10 (Data Grouping Size)

use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.3  # smoke-proven under ZeRO-3 (peak 65.5G/81.5G).

use_lora: false                   # FULL fine-tune — the deviation under test

enable_thinking: false

# Frozen executor — REMOTE inference.sh (Qwen3-8B). Same as v8.
executor:
  type: infsh
  app: openrouter/qwen3-8b
  history_length: 3
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  max_tokens: 8192
  context_size: 32768
  reasoning_effort: medium

# Content quality judge — REMOTE inference.sh (Qwen3-32B, paper).
judge:
  type: infsh
  app: openrouter/qwen3-32b
  temperature: 0.0
  max_tokens: 256
  context_size: 8192

logging_steps: 1
report_to: wandb

save_strategy: steps
save_steps: 5                     # full-state ZeRO-3 saves are ~16GB each; every
                                  # 5 steps keeps disk sane (12 ckpts × ~16GB).
save_total_limit: 12

wandb_run_name: alfworld-8xh100-algo1-fft
