# DeepSpeed ZeRO-3 for 8B FULL fine-tuning + KL ref model on 8×H100.
# THE working FFT path on this stack (trl 1.4 / transformers 5.9 / deepspeed
# 0.19): a 2026-06-21 smoke ran clean (FFT+KL peaks 65.5/81.5GB, step closes,
# generation progresses under vLLM colocate). ZeRO-2 + vLLM — which older notes
# call "validated" — HUNG here (GPUs 0%, 42min no progress). ZeRO-3 shards
# params + ref model, so beta=0.001 fits. Residual risk: per-step vLLM
# weight-gather under sharded params — watch the reward/KL trend to confirm.
# ZeRO-3 shards PARAMS (not just optimizer+grads like ZeRO-2), so the replicated
# 16GB param copy that OOM'd v6 (FFT+KL under ZeRO-2) drops to ~2GB/rank. The KL
# reference model is also sharded, sidestepping both the v6 OOM and the TRL+FSDP
# ref-device bug noted in configs/alfworld_8xh100_fft.yaml. TRL gathers params
# for the vLLM-colocate generation phase each step (the extra all-gather is the
# wall-time tax FFT pays vs LoRA).
distributed_type: DEEPSPEED
num_processes: 8
mixed_precision: bf16
deepspeed_config:
  deepspeed_multinode_launcher: standard
  zero_stage: 3
  # MUST match the training config's gradient_accumulation_steps: DeepSpeed
  # asserts train_batch_size == micro_batch_per_gpu * accum * world_size and
  # fails at launch otherwise (32 != 4 * 2 * 8). Batch lives in TWO files; a
  # change here without one there is a launch-time assert, not a silent bug.
  # 4 pairs with alfworld_dense_fft.yaml's batch_size: 1 → 1 * 4 * 8 = 32.
  # Accumulation no longer costs generation concurrency: generation_batch_size
  # is pinned to 32 there, so all 32 rollouts still run in one pass.
  gradient_accumulation_steps: 4
  gradient_clipping: 1.0
  zero3_init_flag: true
  zero3_save_16bit_model: true
  # OOM'd 2026-08-17 in the backward pass: rank5 wanted 4.64 GiB with 2.87 free.
  # Cause was max_completion_length 16384 (4x longer sequences, non-negotiable for
  # |G|=10 fidelity) stacking with per_device 4.
  #
  # Offloading Adam states to host RAM frees ~8 GiB/GPU — a 4x margin on the
  # shortfall — and costs optimizer-step time, which is the cheapest thing we have:
  # the gradient step is 1.4% of wall in this workload, the other 85% is waiting on
  # remote executor calls. 8B fp32 Adam states are ~64 GiB total against 2 TB of
  # host RAM.
  #
  # NOT lowering vllm_gpu_memory_utilization below 0.3: 0.3 of 80 GiB is 24 GiB,
  # of which the 8B bf16 weights are 16, leaving ~8 for KV cache. At 16k-token
  # completions that is already tight; cutting it would trade an OOM in training
  # for a failure in generation.
  #
  # Offload alone was NOT enough: the very next attempt OOM'd again at 22:10,
  # this time asking for 14.21 GiB. That size identifies it as the logits tensor
  # (per_device x seq x vocab), not optimizer state, so the real fix is the
  # micro-batch split in alfworld_dense_fft.yaml. Offload stays on because the
  # headroom it buys is real and the optimizer step is 1.4% of wall — but it was
  # treating a symptom. Two OOMs, ~4h of GPU time, because I sized the first fix
  # to the first traceback instead of computing what actually holds the memory.
  offload_optimizer_device: cpu
  offload_param_device: none
